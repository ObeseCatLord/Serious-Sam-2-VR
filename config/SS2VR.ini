; User-adjustable comfort defaults. No headset comfort measurement has been performed.
[Comfort]
FollowStartDegrees=35
FollowStopDegrees=8
FollowDegreesPerSecond=90
PositionStartMeters=0.35
PositionStopMeters=0.10
PositionEaseSeconds=0.35
MenuDistanceMeters=2.2
MenuWidthMeters=2.2
HudDistanceMeters=1.5
HudWidthMeters=1.05
; Right-stick turning: smooth by default; SnapTurn=1 turns in 30-degree steps.
SnapTurn=0
SmoothTurnDegreesPerSecond=150

[Feedback]
FireStrength=0.35
DamageStrength=0.55

; Each eye renders at the OpenXR runtime's recommended image size (which already
; includes the runtime's own supersampling). Scale multiplies it: 1 = as recommended.
[Render]
Scale=1
; Foveated readback: 0 off, 1 when the runtime reports eye gaze (e.g. Steam Frame
; through SteamVR), 2 always (centred without eye gaze). The full view returns at
; FoveationPeriphery of the eye resolution and a FoveationInset-sized region around
; your gaze at full resolution, cutting the per-frame image copies roughly in half.
Foveation=1
FoveationInset=0.4
FoveationPeriphery=0.5
; Desktop window on VR frames: 0 mirrors the left eye (fast), 1 renders the
; world a third time for the desktop like the flat game (slow).
DesktopWorld=0
; Aspect ratio of the game's 2D view in VR (menus, HUD, cutscenes, movies).
UiAspect=1.7778

; Hand-held weapon size. Each weapon is scaled so Sam's hands look the same size
; across weapons (matched to the flat game); Scale multiplies all of them
; (0 or 1 = as matched).
; A [WeaponN] section may also set Scale= to adjust a single weapon.
[Weapons]
Scale=0

[Laser]
Enabled=1
MaxDistanceMeters=100

; Development handheld/seated world head-volume protection, disabled by default.
; Obstructed/unavailable clearance makes the world opaque; UI remains available.
; Native exclusions can omit the ridden mechanism; cockpit interiors are unverified.
; This setting does not move a body. See docs/HEAD_VOLUME_INTEGRATION.md.
[HeadComfort]
Enabled=0
RadiusMeters=0.12
ClearanceMarginMeters=0.05

; Optional per-weapon alignment. IDs are listed in docs/WEAPON_IDS.md.
; Positions are meters in the controller aim basis: X right, Y up, Z backward.
; Both gun-model placement and native muzzle retargeting share this offset.
[Weapon12]
OffsetX=0
OffsetY=0
OffsetZ=0
PitchDegrees=0
YawDegrees=0
RollDegrees=0

; Native remote head bones inside admitted frozen VR stereo passes.
; Actual multiplayer appearance requires in-VR acceptance; set 0 to disable.
[Multiplayer]
; Remote head writes are admitted only inside a frozen VR stereo render pair.
RemoteHeadTracking=1

[Scope]
; Optical presentation eye relief; native per-weapon zoom timing stays unchanged.
EyeReliefMeters=0.1

[Swimming]
; 0: head-directed joystick only (default). 1: also enable forward arm pulls.
; Joystick input always takes priority. Hand tracking loss stops arm propulsion.
; Restart the VR host/game after changing settings. Applies to Windows and Proton.
Immersive=0

[Vehicles]
; Fighter/Saucer submitted-handle steering; enabled by default in code.
; Release squeeze, then press near a handle. Literal driver wheels remain unsupported.
; User-operated checks: docs/VEHICLE_GRIP_USER_TEST.md. Restart host/game after changes.
ImmersiveGrips=1

[SteeringWheel]
; Virtual wheel for driven vehicles without authored controls (Fighter/Saucer keep
; their handles). Squeeze on the rim with either or both hands and turn it.
; Cars steer from the wheel; hover and air vehicles turn at TurnRateDegrees per
; second at full lock. Position is meters from your seated eyes: X right, Y up,
; Z backward. Uses the stock HoverFighter texture from your game files.
Enabled=1
OffsetX=0
OffsetY=-0.38
OffsetZ=-0.42
TiltDegrees=25
Scale=1
MaxAngleDegrees=135
FullLockDegrees=90
TurnRateDegrees=120
; Development check: also show the wheel while on foot (no steering).
PreviewOnFoot=0

[Roomscale]
; Development gate; local XR body settlement uses native multiplayer propagation.
; Gameplay/collision/convergence acceptance remains user-operated.
Enabled=0

[Melee]
; Unique circular-saw gesture adapter for SP and matching modded MP roles.
; Hold still after equip/tracking changes before a physical swing.
; Default-off development gate; native first/copy state is never inferred low.
Enabled=0
