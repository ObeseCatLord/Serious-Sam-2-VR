; User-adjustable comfort defaults. No headset comfort measurement has been performed.
[VR]
; 0: play on the desktop with the mod installed (no headset host is started;
;   multiplayer with VR players still works). A start script can set this for
; one launch in next-launch.ini instead.
Enabled=1

[Comfort]
FollowStartDegrees=35
FollowStopDegrees=8
FollowDegreesPerSecond=90
PositionStartMeters=0.35
PositionStopMeters=0.10
PositionEaseSeconds=0.35
MenuDistanceMeters=2.2
MenuWidthMeters=2.2
HudDistanceMeters=1.5
HudWidthMeters=1.05
; Right-stick turning: smooth by default; SnapTurn=1 turns in SnapTurnDegrees steps.
SnapTurn=0
SmoothTurnDegreesPerSecond=150
SnapTurnDegrees=30
; Left-stick walking follows 0 the head, 1 the left controller, 2 the right controller.
MoveDirection=0

[Feedback]
FireStrength=0.35
DamageStrength=0.55

; Each eye renders at the OpenXR runtime's recommended image size (which already
; includes the runtime's own supersampling). Scale multiplies it: 1 = as recommended.
[Render]
Scale=1
; Foveated rendering: 0 off, 1 when the runtime reports eye gaze (dynamic: the
; sharp region follows your eyes, e.g. Steam Frame through SteamVR), 2 always
; (fixed at the view centre without eye gaze). The single pass draws each eye's
; full view at FoveationPeriphery of the eye resolution and a FoveationInset-sized
; region at full resolution, blended with a soft edge. Without zero-copy images
; the same settings shrink the per-frame image copies instead.
Foveation=1
FoveationInset=0.4
FoveationPeriphery=0.5
; Desktop window on VR frames: 0 mirrors the left eye (fast), 1 renders the
; world a third time for the desktop like the flat game (much slower).
DesktopWorld=0
; Dynamic shadows (ren_iDynamicShadowQuality 3): render each shadow image once per
; frame and reuse it for the right eye. 0 renders every shadow image per eye.
ShadowReuse=1
; Two-pass only (SinglePass=0 or frames single pass cannot render): replay the
; left eye's recorded draw calls for the right eye with the view changed (1),
; instead of a second full engine render (0). Off by default: some levels
; (Branchester) lose the static world in the replayed eye.
EyeReplay=0
; Single-pass stereo: the world is traversed once from a centre camera and
; drawn into both eyes (each draw issued per eye half). Takes precedence over
; EyeReplay; 0 renders each eye separately.
SinglePass=1
; Experimental: one instanced draw for both eyes (artifacts remain).
SinglePassInstancing=0
; Water reflections: 0 cubemap (default), a capture of your surroundings held at
; a fixed place in the world (cheap; close objects reflect as if farther away).
; 1 mirror: the world rendered mirrored about the water for each eye (exact at
; any distance; two extra renders while water is in view).
WaterMirror=0
; Size of each mirrored render, as a fraction of an eye's (0.25 to 1).
WaterMirrorScale=0.5
; Draw distance: multiplies the distances at which the game lowers model detail,
; culls small objects and draws grass and clutter (from your video settings).
; 1 = as the game is configured, up to 4. Less pop-in, more rendering work.
DrawDistance=2
; Aspect ratio of the game's 2D view in VR (menus, HUD, cutscenes, movies).
UiAspect=1.7778

; Hand-held weapon size. The revolvers are the base; every other weapon has a
; fixed percentage of their size so Sam's hand is the same size whatever he
; holds (weapons without a hand: their grip fits that hand). Scale multiplies
; all weapons (0 or 1 = as matched). A [WeaponN] section's Scale= multiplies a
; single weapon (N = native weapon id, 12 = revolvers).
; AmmoScreens=1 prints the held weapon's ammo as a small glowing readout on
; every gun that uses ammo, on its screen where it has one (the revolvers show
; the rounds left in the cylinder, the Serious Bomb its count); 0 = none.
[Weapons]
Scale=0
AmmoScreens=1

[Grenades]
; 1: clicking the right stick throws a hand grenade at once from the right hand,
;    toward where it points, instead of taking one in hand to throw with a
; throwing motion (the default).
QuickThrow=0

[Throwing]
; How far thrown objects go. The game's objects fall about 2.6 times faster
; than real ones; throws are already sped up to follow a real throw's arc, and
; Strength multiplies that (1 = real, 2.5 default: VR throws tend to be gentle,
; nothing in the hand pushes back; up to 5).
Strength=2.5

[Laser]
Enabled=1
MaxDistanceMeters=100

; Development handheld/seated world head-volume protection, disabled by default.
; Obstructed/unavailable clearance makes the world opaque; UI remains available.
; Native exclusions can omit the ridden mechanism; cockpit interiors are unverified.
; This setting does not move a body. See docs/HEAD_VOLUME_INTEGRATION.md.
[HeadComfort]
Enabled=0
RadiusMeters=0.12
ClearanceMarginMeters=0.05

; Optional per-weapon alignment. IDs are listed in docs/WEAPON_IDS.md.
; Positions are meters in the controller aim basis: X right, Y up, Z backward.
; Both gun-model placement and native muzzle retargeting share this offset.
[Weapon12]
OffsetX=0
OffsetY=0
OffsetZ=0
PitchDegrees=0
YawDegrees=0
RollDegrees=0

; Native remote head bones inside admitted frozen VR stereo passes.
; Actual multiplayer appearance requires in-VR acceptance; set 0 to disable.
[Multiplayer]
; Remote head writes are admitted only inside a frozen VR stereo render pair.
RemoteHeadTracking=1

[Scope]
; Optical presentation eye relief; native per-weapon zoom timing stays unchanged.
EyeReliefMeters=0.1
; The sniper scope always shows its magnified picture, IdleMagnification times
; while not zoomed (1.5 to 10). 0: only while zoomed.
AlwaysLive=1
IdleMagnification=4

[Swimming]
; 0: head-directed joystick only (default). 1: also enable forward arm pulls.
; Joystick input always takes priority. Hand tracking loss stops arm propulsion.
; Restart the VR host/game after changing settings. Applies to Windows and Proton.
Immersive=0

[Vehicles]
; Fighter/Saucer submitted-handle steering; enabled by default in code.
; Release squeeze, then press near a handle. Literal driver wheels remain unsupported.
; User-operated checks: docs/VEHICLE_GRIP_USER_TEST.md. Restart host/game after changes.
ImmersiveGrips=1
; Holding the handles turned keeps the ride turning, up to this rate (a control
; stick). The right stick does not turn a ride that has handles. 0 turns it 1:1 with the hands.
GripTurnRateDegrees=120

[Rides]
; Mount and dismount turrets, vehicles and creatures at once, without the
; enter/exit animation (shown flat in VR). 0 plays the game's animation.
InstantTransitions=1
; Dinosaurs aim where the right hand points (a laser from the hand shows where
; shots land); the right stick turns you and the left stick walks where you
; face. 0: the right stick turns and tilts the dinosaur's aim.
HandAimCreatures=1
; A ride's guns pitch up and down with your head. 0 pitches them with the right stick.
HeadPitchAim=1

[HUD]
; 1: the game's HUD as watch faces on your wrists - turn a wrist toward you to read it.
; Left: health, armor, lives, air, power-ups, left-hand ammo. Netricsa always stays head-mounted.
; Right: ammo, grenades, bombs, vehicle ammo, score. Messages, prompts and the boss bar
; stay head-mounted. 0: the whole HUD head-mounted (as before). Also in the VR options menu.
Mode=1
; Metres the full width of the game's HUD spans on a wrist (0.31: the health bar is about 10 cm).
WristScale=0.31

[Audio]
; Spatial sound: the game plays through OpenAL Soft (Bin/SS2VR/OpenAL32.dll) with HRTF
; headphone rendering and your tracked head as the listener; the game's own room
; reverb (EAX) is kept. 0: the game's own DirectSound output.
Spatial=1
; Sounds behind walls are muffled (a ray from your head to each sound, 5 times a second).
Occlusion=1

[Voice]
; Voice chat with other SS2VR players in multiplayer (both need this mod).
; The microphone is for talking to other players only: nothing you say
; controls the game. Voices come from where each player is and fade to a
; centred "radio" voice with distance. Microphone: 0 off, 1 open mic (sends
; while you speak), 2 hold a controller to your mouth to talk. The VR options
; panel changes Microphone and Volume.
Receive=1
Microphone=1
Sensitivity=55
InputGain=1
Volume=1
RadioVolume=0.45
SpatialDistanceMeters=24
; Rings over talking players and a dot at your left hand while you send.
Indicators=1
; Capture device by name (as listed in SS2VR.log); empty: the system default.
InputDevice=

[SteeringWheel]
; Virtual wheel for driven vehicles without authored controls (Fighter/Saucer keep
; their handles). Squeeze on the rim with either or both hands and turn it.
; Cars steer from the wheel; hover and air vehicles turn at TurnRateDegrees per
; second at full lock. Position is meters from your seated eyes: X right, Y up,
; Z backward. Uses the stock HoverFighter texture from your game files.
Enabled=1
OffsetX=0
OffsetY=-0.38
OffsetZ=-0.42
TiltDegrees=25
Scale=1
MaxAngleDegrees=135
FullLockDegrees=90
TurnRateDegrees=120
; Development check: also show the wheel while on foot (no steering).
PreviewOnFoot=0

[Roomscale]
; Development gate; local XR body settlement uses native multiplayer propagation.
; Gameplay/collision/convergence acceptance remains user-operated.
Enabled=0

[Melee]
; Unique circular-saw gesture adapter for SP and matching modded MP roles.
; Hold still after equip/tracking changes before a physical swing.
; Default-off development gate; native first/copy state is never inferred low.
Enabled=0
