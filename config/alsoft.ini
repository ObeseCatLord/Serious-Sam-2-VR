# OpenAL Soft settings for SS2VR spatial audio ([Audio] Spatial in SS2VR.ini).
# Headphone HRTF rendering of every sound's direction; the game's own EAX room
# environments run on OpenAL Soft's EAX emulation (on by default).
[general]
stereo-mode = headphones
stereo-encoding = hrtf
hrtf = true
hrtf-mode = full
frequency = 48000

